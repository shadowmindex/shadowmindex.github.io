<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portal — ShadowMindex</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-card { max-width: 420px; margin: 72px auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .pwd-input { width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); margin: 8px 0 14px; }
    .error-msg { color: #fca5a5; font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="unlock-shell">
    <main class="container">
      <div class="login-card">
        <div class="badge">Restricted</div>
        <h1 style="font-size:1.6rem;margin-bottom:8px;">Unlock Portal</h1>
        <form id="unlock-form">
          <input class="pwd-input" id="pwd" type="password" autocomplete="current-password" placeholder="Passphrase" required />
          <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">Unlock</button>
          <div class="error-msg" id="err"></div>
        </form>
      </div>
    </main>
  </div>
  <div id="portal-mount" style="display:none;"></div>
  <script>
    const SESSION_KEY = "sm_admin_bundle_v2";
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    function mountApp(bundle) {
      if (!bundle || !bundle.app_html || !bundle.data) {
        throw new Error("Invalid session bundle");
      }
      window.__SM_PORTAL_DATA__ = bundle.data;
      document.getElementById("unlock-shell").style.display = "none";
      const mount = document.getElementById("portal-mount");
      mount.style.display = "block";

      const doc = new DOMParser().parseFromString(bundle.app_html, "text/html");
      doc.querySelectorAll("style").forEach(st => {
        const clone = document.createElement("style");
        clone.textContent = st.textContent;
        document.head.appendChild(clone);
      });
      mount.innerHTML = doc.body.innerHTML;
      const loginView = mount.querySelector("#login-view");
      if (loginView) loginView.style.display = "none";

      doc.querySelectorAll("script").forEach(oldScript => {
        const s = document.createElement("script");
        s.textContent = oldScript.textContent;
        document.body.appendChild(s);
      });
    }

    async function unlock(pwd) {
      const enc = await (await fetch("admin_data.enc.json", { cache: "no-store" })).json();
      const k0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
      const k1 = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iterations || 250000, hash: "SHA-256" },
        k0,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const bundle = JSON.parse(new TextDecoder().decode(
        await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.nonce) }, k1, b64(enc.ciphertext))
      ));
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(bundle));
      mountApp(bundle);
    }

    document.getElementById("unlock-form").addEventListener("submit", async e => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "Decrypting...";
      try {
        await unlock(document.getElementById("pwd").value);
      } catch (_) {
        err.textContent = "Invalid passphrase.";
      }
    });

    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
      try {
        mountApp(JSON.parse(saved));
      } catch (_) {
        sessionStorage.removeItem(SESSION_KEY);
      }
    }
  </script>
</body>
</html>
